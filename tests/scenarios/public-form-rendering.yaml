feature: public-form-rendering
phase: 6
database: not-required
axes:
  form_state: [missing, draft, archived, published]
  access_mode: [guest_and_authenticated, authenticated_only, admin_only]
  actor: [guest, authenticated, admin]
  renderer: [supported, unknown, incompatible, unavailable]
  field_privacy: [normal, sensitive, hidden]
effects:
  - published current FormVersion snapshot is the only read source
  - denied and unavailable forms resolve to the not-found boundary
  - renderer identifiers and components remain allowlisted
  - sensitive and hidden defaults are not exposed
  - submission POST and handler execution remain absent
verification:
  db_free:
    - tests/Unit/Phase6/FormLayoutProjectorTest.php
    - tests/Unit/Phase6/PublicFormServiceTest.php
    - tests/Unit/Phase6/PublicRenderingStructureTest.php
  deferred:
    - published database row integration
    - active user route and layout composition
    - browser rendering across active user templates
