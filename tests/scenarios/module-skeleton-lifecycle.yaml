# audit:allow test-scenario-coverage reason: Phase 1 skeleton의 단일 lifecycle 축을 filesystem test와 격리 DB lifecycle test가 직접 검증한다.
feature: Glitter Form Builder Phase 1 module skeleton lifecycle

description: |
  비즈니스 schema와 공개 surface 없이 bundled source에서 공식 module lifecycle을 통과하고,
  namespace, metadata, 번역, 설치 출력과 cleanup 계약이 일치하는지 검증한다.

axes:
  lifecycle_state: [discovered, installed, active, inactive, uninstalled]
  source_kind: [bundled, active_output]

effects:
  - bundled_source_is_preserved
  - active_output_is_created_only_by_lifecycle
  - manifest_composer_provider_namespace_is_consistent
  - translation_keys_have_ko_en_parity
  - no_route_menu_permission_or_business_table_surface
  - uninstall_removes_active_output

test_files:
  - modules/_bundled/glitter-form_builder/tests/Feature/ModuleSkeletonTest.php
  - modules/_bundled/glitter-form_builder/tests/Feature/ModuleLifecycleTest.php

notes: |
  Lifecycle test는 APP_ENV=testing과 이름에 test가 포함된 명시적 전용 DB를 모두 확인한 뒤에만
  write lifecycle을 실행한다. 조건이 없으면 production DB 보호를 위해 skip한다.
